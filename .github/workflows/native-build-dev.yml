name: Native Build (Dev)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Build native image
        run: |
          ./gradlew nativeCompile --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logvue-darwin-aarch64-dev
          path: backend/build/native/nativeCompile/